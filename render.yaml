services:
  - type: web
    name: velozity-backend
    runtime: docker
    region: oregon
    plan: free
    rootDir: backend
    dockerContext: ./
    dockerfilePath: ./Dockerfile
    repo: https://github.com/jaiswalyug07/velozity-dashboard
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: COOKIE_SECURE
        value: "true"
      # Set to the frontend origin (Vercel URL) after the SPA is deployed.
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: velozity-db
          property: connectionString
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true

databases:
  - name: velozity-db
    plan: free
    region: oregon