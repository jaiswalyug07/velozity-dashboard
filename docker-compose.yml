services:
  db:
    image: postgres:16-alpine
    container_name: velozity-db
    environment:
      POSTGRES_USER: velozity
      POSTGRES_PASSWORD: velozity
      POSTGRES_DB: velozity
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velozity -d velozity"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: velozity-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://velozity:velozity@db:5432/velozity?schema=public
      CLIENT_URL: http://localhost:8080
      ACCESS_TOKEN_SECRET: docker-demo-change-me-access-secret-32chars
      REFRESH_TOKEN_SECRET: docker-demo-change-me-refresh-secret-32chars
      # Demo runs over plain HTTP; disable secure cookies.
      COOKIE_SECURE: "false"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: velozity-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata: